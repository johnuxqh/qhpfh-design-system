<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QHPFH Design System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="masthead__inner">
        <div class="brand">
          <div class="qg-mark">Queensland<br>Government</div>
          <div class="brand-sep"></div>
          <h1>QH Patient Flow Hub</h1>
        </div>
        <div class="header-tools">
          <label class="search" aria-label="Search">
            <input type="text" placeholder="" />
            <button class="btn btn--primary btn--search">Search</button>
          </label>
          <button class="profile" id="toasterToggle" aria-expanded="false" aria-controls="toasterMenu">
            <span class="avatar"></span>
            <span>Dr Steven Strange</span>
            <span class="chevron">⌄</span>
          </button>
        </div>
      </div>
    </header>

    <nav class="primary-nav" aria-label="Primary">
      <button class="home">⌂</button>
      <a href="#" class="is-selected">MyHub</a>
      <a href="#">Hospital Overview</a>
      <a href="#">Delayed Discharge <span>⌄</span></a>
      <a href="#">Bed &amp; Ward <span>⌄</span></a>
      <a href="#">Scenario Mapping</a>
      <a href="#">Patient Journey</a>
      <a href="#">Connected Apps</a>
    </nav>

    <nav class="secondary-nav" aria-label="Secondary">
      <a href="#" class="is-selected">DD Hub</a>
      <a href="#">Patient Management</a>
      <a href="#">Census Management</a>
      <a href="#">DDP Census</a>
    </nav>

    <main class="main-content">
      <div class="filter-bar" role="group" aria-label="Filters">
        <label>HSS:
          <button class="filter-dd">All <span>⌄</span></button>
        </label>
        <label>Facility:
          <button class="filter-dd">All <span>⌄</span></button>
        </label>
        <label>Ward:
          <button class="filter-dd">All <span>⌄</span></button>
        </label>
      </div>

      <section class="button-row" aria-label="Buttons">
        <button class="btn btn--primary">Primary action</button>
        <button class="btn btn--secondary">Secondary</button>
        <button class="btn btn--ghost">Ghost</button>
      </section>
    </main>

    <menu class="toaster" id="toasterMenu" hidden>
      <button class="is-selected">On Call</button>
      <button>Support</button>
      <button>Notifications</button>
    </menu>
  </div>

  <script src="script.js"></script>
</body>
</html>
